services:
  piper:
    # Not published to a registry: always build on deploy instead of pulling.
    pull_policy: build
    build:
      context: .
      args:
        VOICE: en_US-hfc_female-medium
    image: braingain/piper:1.8.0-en_US-hfc_female-medium
    container_name: piper
    restart: unless-stopped
    ports:
      - "5000:5000"

networks:
  default:
    name: braingain
