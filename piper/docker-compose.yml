services:
  piper:
    # A new voice needs a new image tag, or redeploys reuse the old image.
    build:
      context: .
      args:
        VOICE: ${VOICE:-en_US-hfc_female-medium}
    image: braingain/piper:1.8.0-${VOICE:-en_US-hfc_female-medium}
    container_name: piper
    restart: unless-stopped
    ports:
      - "5000:5000"

networks:
  default:
    name: braingain
