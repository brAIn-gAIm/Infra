services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: braingain
      POSTGRES_PASSWORD: braingain
      POSTGRES_DB: braingain
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braingain"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: braingain

