# Production stack for Dokploy (branch deploy/dokploy), served at ${PUBLIC_URL}.
# Only `frontend` is routed by Traefik (Dokploy → Domains); its nginx proxies /api → backend
# and /cdn → cdn. Nothing else publishes a port. Secrets come from the Dokploy Environment tab
# (see .env.example).
x-database-url: &database-url postgresql://braingain:${POSTGRES_PASSWORD}@postgres:5432/braingain

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: braingain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password (URL-safe characters only)}
      POSTGRES_DB: braingain
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braingain -d braingain"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3 access key for rustfs}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3 secret key for rustfs}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_VOLUMES: "/data"
    volumes:
      - rustfs_data:/data

  s3-init:
    image: amazon/aws-cli:2.38.4
    restart: "no"
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket braingain 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3 mb s3://braingain; do sleep 1; done

  piper:
    # Not published to a registry: always build on deploy instead of pulling.
    pull_policy: build
    build:
      context: ./piper
      args:
        VOICE: en_US-hfc_female-medium
    image: braingain/piper:1.8.0-en_US-hfc_female-medium
    restart: unless-stopped

  cdn:
    image: ghcr.io/brain-gaim/cdn:0.0.8
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      # Traefik terminates TLS in front of the frontend's /cdn/ proxy.
      TLS_ENABLED: "false"
      CDN_BASE_URL: ${PUBLIC_URL:?public URL without trailing slash, e.g. https://braingain.joachimkern.de}/cdn
      MAX_UPLOAD_SIZE_MB: "500"
      S3_ENDPOINT: "http://rustfs:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "braingain"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_USE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LiteLLM's own database on the same Postgres; idempotent, so it also works on an existing volume.
  litellm-db-init:
    image: postgres:18.6-alpine3.24
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: braingain
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: braingain
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1
        || createdb litellm

  # LLM proxy (Backend#44): routes the backend's model aliases to Anthropic and enforces spend
  # budgets. Reachable only inside the stack network, at http://litellm:4000.
  litellm:
    image: ghcr.io/berriai/litellm:v1.106.3
    restart: unless-stopped
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
    # Config inline, as in backend/docker-compose.yaml, so the stack is a single file.
    entrypoint:
      - /bin/sh
      - -c
      - printf '%s\n' "$$LITELLM_CONFIG" > /tmp/config.yaml && exec litellm --config /tmp/config.yaml --port 4000
    environment:
      LITELLM_CONFIG: |
        # The backend asks for an alias, the proxy picks the Anthropic model, tracks spend per
        # key and stops at the budgets below. Secrets come from the environment.
        model_list:
          - model_name: smart # writes games and round inputs
            litellm_params:
              model: anthropic/claude-haiku-5-5
              api_key: os.environ/ANTHROPIC_API_KEY
          - model_name: fast # cheaper fallback
            litellm_params:
              model: anthropic/claude-haiku-5-5
              api_key: os.environ/ANTHROPIC_API_KEY

        router_settings:
          fallbacks: [{ "smart": ["fast"] }]
          num_retries: 1

        litellm_settings:
          # Drop request parameters a model does not support instead of failing.
          drop_params: true
          # Prompts contain users' documents: keep spend and token counts, never message content.
          turn_off_message_logging: true
          # Hard cap for the whole proxy, on top of each key's own budget.
          max_budget: 50 # USD
          budget_duration: 30d

        general_settings:
          master_key: os.environ/LITELLM_MASTER_KEY
          database_url: os.environ/DATABASE_URL
          store_prompts_in_spend_logs: false
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Anthropic API key}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?admin key for the proxy, starts with sk-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?encrypts stored keys; never change it after first start}
      DATABASE_URL: postgresql://braingain:${POSTGRES_PASSWORD}@postgres:5432/litellm
    healthcheck:
      # The image has no curl; the first start also runs Prisma migrations, hence the long grace.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Registers the backend's budgeted virtual key (LITELLM_BACKEND_KEY) once; later runs see it
  # already exists. The backend never gets the Anthropic key or the master key.
  litellm-key-init:
    image: curlimages/curl:8.22.0
    restart: "no"
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      MASTER_KEY: ${LITELLM_MASTER_KEY}
      BACKEND_KEY: ${LITELLM_BACKEND_KEY:?virtual key for the backend, starts with sk-}
      BACKEND_BUDGET: ${LITELLM_BACKEND_BUDGET:-20}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        auth="Authorization: Bearer $$MASTER_KEY"
        if curl -fs -o /dev/null -H "$$auth" "http://litellm:4000/key/info?key=$$BACKEND_KEY"; then
          echo "backend key exists"
        else
          curl -fsS -o /dev/null -X POST http://litellm:4000/key/generate \
            -H "$$auth" -H 'Content-Type: application/json' \
            -d "{\"key\": \"$$BACKEND_KEY\", \"key_alias\": \"backend\", \"max_budget\": $$BACKEND_BUDGET, \"budget_duration\": \"30d\"}"
          echo "backend key created"
        fi

  backend:
    image: ghcr.io/brain-gaim/backend:0.0.32
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cdn:
        condition: service_healthy
      piper:
        condition: service_started
      litellm-key-init:
        condition: service_completed_successfully
    # The image's default command runs `alembic upgrade head`, then serves on port 8000.
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?at least 32 characters}
      # Used for browser links and for the backend's own uploads/downloads (via the public URL).
      CDN_BASE_URL: ${PUBLIC_URL}/cdn
      TTS_URL: http://piper:5000
      LLM_PROVIDER: litellm
      LLM_BASE_URL: http://litellm:4000
      LLM_MODEL: smart
      LLM_API_KEY: ${LITELLM_BACKEND_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  seed:
    image: ghcr.io/brain-gaim/backend:0.0.32
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
      cdn:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET}
      CDN_BASE_URL: http://cdn:8080
      SEED_USER: ${SEED_USER:-braingain}
      SEED_PASSWORD: ${SEED_PASSWORD:?password of the seeded owner user}
      GAMES_TARBALL_URL: ${GAMES_TARBALL_URL:-https://codeload.github.com/brAIn-gAIm/Backend/tar.gz/main}
    command:
      - python
      - -c
      - |
        import asyncio, io, json, os, tarfile, tempfile, urllib.request
        from pathlib import Path
        from sqlalchemy import select
        from app.db import SessionLocal, engine
        from app.models import Content, User
        from app.security import hash_password
        from app.seed_game import seed_game, update_game

        TITLES = {
            "bounce-climber": "Bounce Climber",
            "chain-snake": "Chain Snake",
            "collect-men": "Collect Men",
            "dodge": "Dodge",
            "dodge3d": "Dodge 3D",
            "example-quiz": "Example Quiz",
            "glass-bridge": "Glass Bridge",
        }

        async def main() -> None:
            username = os.environ["SEED_USER"]
            password = os.environ["SEED_PASSWORD"]
            tarball_url = os.environ["GAMES_TARBALL_URL"]

            print(f"Fetching games from {tarball_url} ...")
            with urllib.request.urlopen(tarball_url, timeout=60) as resp:
                raw = resp.read()

            with tempfile.TemporaryDirectory() as tmp:
                with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tar:
                    members = [
                        m for m in tar.getmembers()
                        if "/games/" in m.name and not m.name.startswith("/") and ".." not in m.name
                    ]
                    tar.extractall(path=tmp, members=members, filter="data")

                games_dirs = sorted(Path(tmp).glob("*/games/*"))
                async with SessionLocal() as session:
                    user = await session.scalar(select(User).where(User.username == username))
                    if user is None:
                        user = User(username=username, password_hash=hash_password(password))
                        session.add(user)
                        await session.commit()
                        print(f"Created seed owner user: {username!r}")

                    for game_dir in games_dirs:
                        if not (game_dir / "game.js").is_file() or not (game_dir / "config.json").is_file():
                            continue
                        title = TITLES.get(game_dir.name, game_dir.name.replace("-", " ").title())
                        existing = await session.scalar(
                            select(Content).where(Content.kind == "game", Content.title == title)
                        )
                        if existing is None:
                            game = await seed_game(session, game_dir, title, username)
                            action = "seeded"
                        else:
                            game = await update_game(session, game_dir, title)
                            action = "updated"
                        print(json.dumps({"action": action, "id": str(game.id), "title": game.title}))

            await engine.dispose()

        asyncio.run(main())

  frontend:
    image: ghcr.io/brain-gaim/frontend:0.2.27
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      cdn:
        condition: service_healthy

volumes:
  postgres_data:
  rustfs_data:

networks:
  default:
    name: braingain
