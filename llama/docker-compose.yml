services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-b11515
    container_name: llama
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      # Downloaded into the volume on first start, then reused.
      LLAMA_ARG_HF_REPO: unsloth/Qwen3-1.7B-GGUF:Q4_K_M
      LLAMA_CACHE: /models
      LLAMA_ARG_CTX_SIZE: 8192
      LLAMA_ARG_N_PARALLEL: 1
      # Leave one of the host's four cores for the other services.
      LLAMA_ARG_THREADS: 3
      # Qwen3 thinks by default, which spends the token budget on prose
      # before the schema-constrained JSON starts.
      LLAMA_ARG_REASONING: "off"
    volumes:
      - llama_models:/models
    mem_limit: 5g

volumes:
  llama_models:

networks:
  default:
    name: braingain
